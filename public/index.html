<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced YouTube Scraper</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-red-500 mb-2">YT Scraper Engine</h1>
            <p class="text-gray-400 text-sm">yt-dlp bağımlılığı olmadan, proxy üzerinden native veri analizi</p>
        </header>

        <div class="max-w-2xl mx-auto bg-gray-800 p-6 rounded-lg shadow-xl mb-8">
            <div class="flex gap-4">
                <input type="text" id="channelInput" placeholder="Örn: @BarisOzcan veya @webtekno" 
                       class="flex-1 bg-gray-700 border border-gray-600 rounded px-4 py-3 text-white focus:outline-none focus:border-red-500">
                <button onclick="startScrape()" id="btn" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-3 rounded transition-all">
                    Verileri Çek
                </button>
            </div>
            <div id="loader" class="hidden mt-4 text-center text-yellow-500 animate-pulse">YouTube proxy datası parse ediliyor, lütfen bekleyin...</div>
        </div>

        <div id="channelMeta" class="hidden max-w-4xl mx-auto bg-gray-800 p-6 rounded-lg shadow-xl mb-8 border-l-4 border-red-500">
            <h2 id="metaName" class="text-2xl font-bold text-white mb-1"></h2>
            <div class="flex gap-6 my-3 text-sm text-gray-300">
                <span class="bg-gray-700 px-3 py-1 rounded">Abone: <strong id="metaSubs" class="text-red-400"></strong></span>
                <span class="bg-gray-700 px-3 py-1 rounded">Listelenen Video: <strong id="metaCount" class="text-red-400"></strong></span>
            </div>
            <p id="metaDesc" class="text-gray-400 text-sm mt-2 italic line-clamp-3"></p>
        </div>

        <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto"></div>
    </div>

    <script>
        async function startScrape() {
            const channel = document.getElementById('channelInput').value.trim();
            if(!channel) return alert('Kanal kullanıcı adını girin.');

            const loader = document.getElementById('loader');
            const btn = document.getElementById('btn');
            const grid = document.getElementById('videoGrid');
            const metaBox = document.getElementById('channelMeta');

            loader.classList.remove('hidden');
            btn.disabled = true;
            grid.innerHTML = '';
            metaBox.classList.add('hidden');

            try {
                const response = await fetch(`/api/scrape?channel=${encodeURIComponent(channel)}`);
                const data = await response.json();

                if(data.error) {
                    alert(data.error);
                    return;
                }

                // Meta verileri bas
                document.getElementById('metaName').innerText = data.channelName;
                document.getElementById('metaSubs').innerText = data.subscriberCount;
                document.getElementById('metaCount').innerText = data.estimatedLoadedVideoCount;
                document.getElementById('metaDesc').innerText = data.description || 'Açıklama yok.';
                metaBox.classList.remove('hidden');

                // Videoları bas
                data.videos.forEach(video => {
                    const card = document.createElement('div');
                    card.className = "bg-gray-800 rounded-lg overflow-hidden shadow-lg border border-gray-700 hover:border-gray-500 transition-all flex flex-col";
                    card.innerHTML = `
                        <div class="relative pt-[56.25%] bg-gray-900">
                            <img src="${video.thumbnail}" alt="${video.title}" class="absolute top-0 left-0 w-full h-full object-cover">
                        </div>
                        <div class="p-4 flex flex-col flex-1 justify-between">
                            <h3 class="text-white font-medium text-sm line-clamp-2 mb-3" title="${video.title}">${video.title}</h3>
                            <div class="flex justify-between items-center text-xs text-gray-400 mt-auto">
                                <span>${video.viewCount || ''}</span>
                                <span>${video.publishedTime || ''}</span>
                            </div>
                            <a href="${video.url}" target="_blank" class="block text-center bg-gray-700 hover:bg-red-600 text-white text-xs font-bold py-2 px-4 rounded mt-4 transition-colors">
                                Videoya Git
                            </a>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                alert('Sistem hatası.');
            } finally {
                loader.classList.add('hidden');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
